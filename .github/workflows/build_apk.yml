name: Build Android APK & AppBundle (스토어 & 갤럭시 설치 파일)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK (Universal & Slim Split)
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-yak-android-builds
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

      - name: Publish Latest APK to GitHub Releases (원클릭 직접 다운로드)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "My 약 (My Yak) 최신 앱 설치 파일 (Universal & 슬림 경량화)"
          body: |
            ### 📱 My 약 (My Yak) 안드로이드(갤럭시) 설치 파일
            
            - **추천 파일:**
              - `app-arm64-v8a-release.apk` : **갤럭시 최적화 초경량 슬림 버전 (약 10MB, 다운로드 용량 60% 절감)**
              - `app-release.apk` : 모든 기기 호환 범용 버전 (Universal)
              - `app-release.aab` : 구글 플레이스토어 공식 등록용 번들
            - **설치 방법:**
              1. 아래 **Assets**에서 `app-arm64-v8a-release.apk` 또는 `app-release.apk`를 스마트폰(갤럭시)에서 다운로드합니다.
              2. 다운로드 완료 후 파일을 열어 **[설치]**를 진행합니다.
                 *(출처를 알 수 없는 앱 설치 경고가 뜰 경우 '이번에만 허용' 또는 '무시하고 설치' 선택)*
              3. 앱 실행 후 프로필과 복약 관리를 시작하세요!
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
